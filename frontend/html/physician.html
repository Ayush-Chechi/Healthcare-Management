<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Physician Consultation</title>
  <style>
    :root {
      --primary-color: #8B5FBF;
      --secondary-color: #6C63FF;
      --accent: #36D1DC;
      --radius: 15px;
      --shadow: 0 10px 30px rgba(139, 95, 191, 0.15);
      --transition: 0.4s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #2D2D2D;
      padding: 20px;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 80%, rgba(139, 95, 191, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(108, 99, 255, 0.1) 0%, transparent 50%);
      z-index: -1;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    h1 {
      text-align: center;
      color: white;
      font-size: 2.2rem;
      margin-bottom: 15px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 30px;
      font-weight: 600;
    }

    h3 {
      color: var(--primary-color);
      font-size: 1.3rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    form > div {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      color: var(--primary-color);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid rgba(139, 95, 191, 0.2);
      background: rgba(255, 255, 255, 0.95);
      font-family: inherit;
      font-size: 1rem;
      color: #2D2D2D;
      transition: all var(--transition);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(139, 95, 191, 0.1);
      transform: translateY(-2px);
      background: white;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    button {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      grid-column: 1 / -1;
      box-shadow: var(--shadow);
      transition: all var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(139, 95, 191, 0.25);
    }

    button:active {
      transform: translateY(-1px);
    }

    .availability-status {
      text-align: center;
      font-size: 18px;
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(139, 95, 191, 0.05);
      border-radius: 10px;
      border: 1px solid rgba(139, 95, 191, 0.2);
    }

    .status-dot {
      font-weight: bold;
      margin-left: 10px;
      padding: 8px 16px;
      border-radius: 20px;
      color: white;
      background-color: #999;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .status-online {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .status-offline {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    .chat-container {
      background: linear-gradient(135deg, rgba(139, 95, 191, 0.05), white);
      padding: 25px;
      border-radius: var(--radius);
      margin-top: 30px;
      border: 1px solid rgba(139, 95, 191, 0.2);
    }

    .chat-box {
      height: 280px;
      overflow-y: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(139, 95, 191, 0.2);
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-box::-webkit-scrollbar {
      width: 8px;
    }

    .chat-box::-webkit-scrollbar-track {
      background: rgba(139, 95, 191, 0.1);
      border-radius: 10px;
    }

    .chat-box::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      border-radius: 10px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      text-align: right;
      margin-left: auto;
      box-shadow: 0 4px 12px rgba(139, 95, 191, 0.2);
    }

    .message.physician {
      background: rgba(54, 209, 220, 0.15);
      color: var(--primary-color);
      text-align: left;
      border: 1px solid rgba(139, 95, 191, 0.2);
    }

    .chat-input {
      display: flex;
      gap: 12px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid rgba(139, 95, 191, 0.2);
      background: white;
      font-family: inherit;
      transition: all var(--transition);
    }

    .chat-input input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(139, 95, 191, 0.1);
    }

    .chat-input button {
      width: 100px;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }

    .chat-input button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(139, 95, 191, 0.2);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 1.8rem;
        padding: 15px;
      }

      h2 {
        font-size: 1.2rem;
      }

      form {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .chat-input {
        flex-direction: column;
      }

      .chat-input button {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
        margin: 20px auto;
      }

      h1 {
        font-size: 1.5rem;
      }

      h2 {
        font-size: 1rem;
        margin-bottom: 20px;
      }

      form {
        gap: 12px;
      }

      input, select, textarea {
        padding: 12px 14px;
        font-size: 16px;
      }

      button {
        padding: 14px;
        font-size: 1rem;
      }

      .chat-box {
        height: 220px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Physician Consultation</h1>
  <h2>Book an Appointment with Our Doctor</h2>

  <!-- Appointment Form -->
  <form id="physicianForm">
    <div>
      <label for="name">Full Name</label>
      <input type="text" id="name" required>
    </div>
    <div>
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required>
    </div>
    <div>
      <label for="email">Email Address</label>
      <input type="email" id="email" required>
    </div>
    <div>
      <label for="date">Preferred Date</label>
      <input type="date" id="date" required>
    </div>
    <div>
      <label for="time">Preferred Time</label>
      <input type="time" id="time" required>
    </div>
    <div>
      <label for="session">Session Type</label>
      <select id="session" required>
        <option value="">Select</option>
        <option>Online</option>
        <option>In-Person</option>
      </select>
    </div>
    <div>
      <label for="location">Clinic Location</label>
      <input type="text" id="location" value="HealthCare Clinic, Block A, New Delhi" readonly>
    </div>
    <div class="full-width">
      <label for="issue">Describe Your Health Concern</label>
      <textarea id="issue" rows="4" placeholder="Fever, cold, fatigue, body pain, etc."></textarea>
    </div>
    <button type="submit">Book Appointment</button>
  </form>

  <!-- Chat Box -->
  <div class="chat-container">
    <h3>💬 Chat with Physician</h3>
    <div id="chatBox" class="chat-box">
      <div class="message physician">Hi! I’m Dr. Sharma. Tell me what symptoms you're experiencing.</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userMessage" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- JS Logic -->
<script>
    alert("Buy Premium Version to get the full access to this feature.");
  // Form submission
  document.getElementById("physicianForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Buy Premium Version for registration.");
    this.reset();
  });

  // Chat logic
  function sendMessage() {
    const input = document.getElementById("userMessage");
    const chatBox = document.getElementById("chatBox");
    const userText = input.value.trim();
    if (userText === "") return;

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = userText;
    chatBox.appendChild(userMsg);

    input.value = "";

    setTimeout(() => {
      const reply = document.createElement("div");
      reply.className = "message physician";
      reply.textContent = getPhysicianReply(userText);
      chatBox.appendChild(reply);
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 1000);
  }

  function getPhysicianReply(message) {
    const msg = message.toLowerCase();
    if (msg.includes("fever")) return "Drink fluids, rest well, and check your temperature regularly.";
    if (msg.includes("cold")) return "Stay hydrated and use steam inhalation. Avoid cold food.";
    if (msg.includes("headache")) return "Try resting and avoid screen time. If persistent, book a visit.";
    return "Thanks for sharing. I’ll analyze and guide you accordingly.";
  }

  // Simulate Physician Availability
  const statusEl = document.getElementById("physicianStatus");
  function updatePhysicianStatus(isOnline) {
    if (isOnline) {
      statusEl.textContent = "Online";
      statusEl.classList.add("status-online");
      statusEl.classList.remove("status-offline");
    } else {
      statusEl.textContent = "Offline";
      statusEl.classList.add("status-offline");
      statusEl.classList.remove("status-online");
    }
  }

  setInterval(() => {
    const isOnline = Math.random() > 0.2;
    updatePhysicianStatus(isOnline);
  }, 10000);

  window.onload = () => updatePhysicianStatus(true);
</script>

</body>
</html>
